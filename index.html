<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词气泡连接</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="input-section">
            <input
                type="text"
                id="wordInput"
                placeholder="输入单词，按回车添加气泡..."
                autocomplete="off"
            >
            <div class="instructions">
                <p>💡 提示：点击两个单词气泡可以创建连接 | 悬停查看关联词 | 双击气泡可以删除</p>
                <p>在空白处按住左键框选多个气泡，拖到另一个气泡上即可归类 | 点击数字角标展开/收起分组</p>
                <p>单击分组大气泡进入内部，按 Esc 或左上角按钮返回</p>
            </div>
            <div class="toolbar">
                <button type="button" id="exportBtn" title="把所有单词和连接下载为 JSON 文件">导出</button>
                <button type="button" id="importBtn" title="从 JSON 文件恢复单词和连接">导入</button>
                <input type="file" id="importInput" accept=".json,application/json" hidden>
                <span id="saveStatus" role="status" aria-live="polite"></span>
            </div>
        </div>

        <!-- 进入分组内部时显示：返回按钮 + 面包屑 -->
        <nav id="viewNav" aria-label="分组导航" hidden>
            <button type="button" id="viewBackBtn">← 返回上一级</button>
            <ol id="viewCrumbs"></ol>
        </nav>

        <canvas id="connectionCanvas"></canvas>
        <div id="bubbleContainer"></div>
    </div>

    <!-- 悬停时显示关联词的浮动面板 -->
    <div id="relatedPopup" role="tooltip" aria-hidden="true"></div>

    <script src="script.js"></script>
</body>
</html>
